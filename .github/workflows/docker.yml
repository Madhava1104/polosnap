name: Build and push image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# The registry address comes from a secret, so it shows as *** in the public logs
env:
  IMAGE: ${{ secrets.HARBOR_REGISTRY }}/static/polosnap
  # Don't attach the build record / summary to the run: they would contain
  # the registry address unmasked, and run artifacts are public on public repos.
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Tags: "latest" on main, short commit SHA always, "1.2.3" when you push a v1.2.3 git tag
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false   # keeps a single clean image in the registry (no "unknown/unknown" attestation entry)
          cache-from: type=gha
          cache-to: type=gha,mode=max
